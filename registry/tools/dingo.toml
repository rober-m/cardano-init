[tool]
id = "dingo"
name = "Dingo"
description = """\
A Cardano node implementation from Blink Labs with batteries included: it \
syncs or produces the chain and serves a Blockfrost-compatible HTTP API \
alongside its own node socket. Use it as cardano-up infrastructure for public \
networks or as a private, single-node Docker devnet. Its API is published to \
the project .env as INDEXER_URL so off-chain components connect automatically."""
website = "https://github.com/blinklabs-io/dingo"
languages = ["go"]
system_deps = ["docker", "cardano-up"]
nix_packages = []
detect = [{ file = "docker-compose.yml", contains = "ghcr.io/blinklabs-io/dingo" }]

[roles.devnet]
template = "dingo/devnet"
system_deps = ["docker"]

[roles.infrastructure]
template = "_infra/cardano-up"
system_deps = ["docker", "cardano-up"]

[infra]
cardano_up_package = "dingo"
env = [
    { from = "DINGO_BLOCKFROST", to = "INDEXER_URL" },
    { from = "DINGO_SOCKET_PATH", to = "NODE_SOCKET_PATH" },
]

# Dingo serves a Blockfrost-compatible HTTP API (published as INDEXER_URL).
[compat]
serves = ["blockfrost"]
